services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Toronto
    volumes:
      - /srv/docker/data/freshrss:/config
    networks:
      - caddy_net
    # internal only (no ports)

networks:
  caddy_net:
    external: true